# If you are not sure what all these fields mean, please refer our documentation here:
# https://evalai.readthedocs.io/en/latest/configuration.html
title: EmbodiedBench Challenge @ CVPR 2026 FMEA Workshop
short_description: Hosted by Foundation Models Meet Embodied Agents (FMEA) Workshop, CVPR 2026
description: templates/description.html
evaluation_details: templates/evaluation_details.html
terms_and_conditions: templates/terms_and_conditions.html
image: logo.png
submission_guidelines: templates/submission_guidelines.html
category: [Paper, Dataset, Environment, Workshop]
leaderboard_description: Held-out test performance for vision-driven embodied agents across EB-ALFRED and EB-Navigation.
evaluation_script: evaluation_script.zip
remote_evaluation: False
start_date: 2026-04-13 00:00:00
end_date: 2026-05-28 23:59:59
published: True
tags:
  - embodied-ai
  - multimodal-large-language-models
  - cvpr-2026
leaderboard:
  - id: 1
    schema:
      {
        "labels": ["Overall Score", "ALFRED SR", "ALFRED Steps", "Navigation SR", "Navigation Steps", "Average Steps"],
        "default_order_by": "Overall Score",
        "metadata": {
          "Overall Score": {
            "sort_ascending": False,
            "description": "Average task success rate across EB-ALFRED and EB-Navigation."
          },
          "ALFRED SR": {
            "sort_ascending": False,
            "description": "Task success rate on EB-ALFRED (%)."
          },
          "ALFRED Steps": {
            "sort_ascending": True,
            "description": "Average steps per episode on EB-ALFRED (lower is better)."
          },
          "Navigation SR": {
            "sort_ascending": False,
            "description": "Task success rate on EB-Navigation (%)."
          },
          "Navigation Steps": {
            "sort_ascending": True,
            "description": "Average steps per episode on EB-Navigation (lower is better)."
          },
          "Average Steps": {
            "sort_ascending": True,
            "description": "Average of per-environment avg steps, used as tiebreaker (lower is better)."
          }
        }
      }

challenge_phases:
  - id: 1
    name: Qualification / Validation Phase
    description: templates/challenge_phase_1_description.html
    leaderboard_public: False
    is_public: True
    challenge: 1
    is_active: True
    max_concurrent_submissions_allowed: 3
    allowed_email_ids: []
    disable_logs: False
    is_submission_public: True
    start_date: 2026-04-13 00:00:00
    end_date: 2026-05-22 23:59:59
    test_annotation_file: annotations/test_annotations_devsplit.json
    codename: dev
    max_submissions_per_day: 5
    max_submissions_per_month: 50
    max_submissions: 50
    default_submission_meta_attributes:
      - name: method_name
        is_visible: True
      - name: method_description
        is_visible: True
      - name: project_url
        is_visible: True
      - name: publication_url
        is_visible: True
    submission_meta_attributes:
      - name: model_name
        description: Name of the submitted model or agent.
        type: text
        required: True
      - name: method_type
        description: Main method category.
        type: radio
        options: ["open-source MLLM", "fine-tuned MLLM", "agent framework", "other"]
        required: True
    is_restricted_to_select_one_submission: False
    is_partial_submission_evaluation_enabled: False
    allowed_submission_file_types: ".zip"
  - id: 2
    name: Final Held-out Test Phase
    description: templates/challenge_phase_2_description.html
    leaderboard_public: True
    is_public: True
    challenge: 2
    is_active: True
    max_concurrent_submissions_allowed: 3
    allowed_email_ids: []
    disable_logs: False
    is_submission_public: True
    start_date: 2026-05-23 00:00:00
    end_date: 2026-05-28 23:59:59
    test_annotation_file: annotations/test_annotations_testsplit.json
    codename: test
    max_submissions_per_day: 5
    max_submissions_per_month: 5
    max_submissions: 5
    default_submission_meta_attributes:
      - name: method_name
        is_visible: True
      - name: method_description
        is_visible: True
      - name: project_url
        is_visible: True
      - name: publication_url
        is_visible: True
    submission_meta_attributes:
      - name: model_name
        description: Name of the submitted model or agent.
        type: text
        required: True
      - name: method_type
        description: Main method category.
        type: radio
        options: ["open-source MLLM", "fine-tuned MLLM", "agent framework", "other"]
        required: True
    is_restricted_to_select_one_submission: False
    is_partial_submission_evaluation_enabled: False
    allowed_submission_file_types: ".zip"

dataset_splits:
  - id: 1
    name: Dev Split
    codename: dev_split
  - id: 2
    name: Test Split
    codename: test_split

challenge_phase_splits:
  - challenge_phase_id: 1
    leaderboard_id: 1
    dataset_split_id: 1
    visibility: 1
    leaderboard_decimal_precision: 2
    is_leaderboard_order_descending: True
    show_execution_time: True
    show_leaderboard_by_latest_submission: True
  - challenge_phase_id: 2
    leaderboard_id: 1
    dataset_split_id: 1
    visibility: 2
    leaderboard_decimal_precision: 2
    is_leaderboard_order_descending: True
    show_execution_time: False
    show_leaderboard_by_latest_submission: False
  - challenge_phase_id: 2
    leaderboard_id: 1
    dataset_split_id: 2
    visibility: 1
    leaderboard_decimal_precision: 2
    is_leaderboard_order_descending: True
    show_execution_time: True
    show_leaderboard_by_latest_submission: True
